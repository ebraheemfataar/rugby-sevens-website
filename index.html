<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSBC SVNS Cape Town - Rugby Sevens</title>
    <meta name="description" content="Watch the world's best rugby sevens teams compete at DHL Stadium, Cape Town. View fixtures, teams, players, and book your seats." />
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background: linear-gradient(135deg, #2d5016 0%, #4a7c2c 100%);">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="bi bi-trophy-fill me-2"></i>
                <span class="fw-bold">SVNS Cape Town</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav gap-1">
                    <li class="nav-item">
                        <a class="nav-link active rounded px-3" href="index.html">
                            <i class="bi bi-calendar-event me-1"></i>
                            <span class="d-none d-sm-inline">Fixtures</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link rounded px-3" href="teams.html">
                            <i class="bi bi-people-fill me-1"></i>
                            <span class="d-none d-sm-inline">Teams</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link rounded px-3" href="players.html">
                            <i class="bi bi-person-fill me-1"></i>
                            <span class="d-none d-sm-inline">Players</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link rounded px-3" href="booking.html">
                            <i class="bi bi-ticket-perforated-fill me-1"></i>
                            <span class="d-none d-sm-inline">Select Seats</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="position-relative" style="height: 400px; overflow: hidden;">
        <img src="hero-stadium.jpg" alt="Cape Town Stadium" class="w-100 h-100" style="object-fit: cover;">
        <div class="position-absolute top-0 start-0 w-100 h-100" style="background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0.3));"></div>
        <div class="position-absolute top-50 start-50 translate-middle text-center text-white w-100 animate-fade-in">
            <h1 class="display-1 fw-bold mb-3">HSBC SVNS</h1>
            <p class="fs-3">Cape Town • Today's Fixtures</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container py-4">
        <div class="d-flex align-items-center gap-2 mb-4">
            <i class="bi bi-geo-alt-fill text-success fs-5"></i>
            <h2 class="mb-0">DHL Stadium, Cape Town</h2>
        </div>

        <div class="row g-4" id="fixtures-container">
            <!-- Fixtures will be loaded here -->
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
